name: app_petshop
description: "Ứng dụng bán hàng và quản lý cửa hàng thú cưng VuiPet."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  cloud_firestore: ^5.6.0
  firebase_storage: ^12.4.0

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.5

  # Format tiền, ngày giờ
  intl: ^0.19.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true